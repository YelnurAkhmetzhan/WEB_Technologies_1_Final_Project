<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Gold Gym account access" />
    <title>Account | Gold Gym</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header sticky-top">
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3" aria-label="Primary navigation">
        <div class="container">
          <a class="navbar-brand logo" href="index.html">GG <span class="ms-2">GOLD GYM</span></a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
          <div class="collapse navbar-collapse" id="main-nav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link fw-bold px-lg-3" href="index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link fw-bold px-lg-3" href="about.html">About</a></li>
              <li class="nav-item"><a class="nav-link fw-bold px-lg-3" href="prices.html">Prices</a></li>
              <li class="nav-item"><a class="nav-link fw-bold px-lg-3" href="trainers.html">Trainers</a></li>
              <li class="nav-item"><a class="nav-link fw-bold px-lg-3" href="locations.html">Locations</a></li>
              <li class="nav-item"><a class="nav-link fw-bold px-lg-3" href="contact.html">Contact</a></li>
              <li class="nav-item"><a class="nav-link fw-bold px-lg-3 active" aria-current="page" href="auth.html">Account</a></li>
              <li class="nav-item"><a class="nav-link fw-bold px-lg-3" href="profile.html">Profile</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section class="hero pt-5 pb-4"><div class="container"><p class="eyebrow">MEMBERS AREA</p><h1 class="mt-2 mb-3">Your training<br />starts here.</h1><p class="lead">Create a simple demo account or log in to view your profile.</p></div></section>
      <section class="container py-5"><div class="row g-4">
        <div class="col-md-6"><form id="signup-form" class="panel-box" novalidate><h2>Sign up</h2>
          <label class="form-label" for="signup-name">Name</label><input class="form-control mb-1" id="signup-name" type="text" autocomplete="name" /><div class="error-text" id="signup-name-error"></div>
          <label class="form-label mt-3" for="signup-email">Email</label><input class="form-control mb-1" id="signup-email" type="text" autocomplete="email" /><div class="error-text" id="signup-email-error"></div>
          <label class="form-label mt-3" for="signup-password">Password</label><input class="form-control mb-1" id="signup-password" type="password" autocomplete="new-password" /><div class="error-text" id="signup-password-error"></div>
          <button class="btn btn-warning mt-3" type="submit">Create account</button><p id="signup-status" class="mt-3 mb-0" role="status"></p>
        </form></div>
        <div class="col-md-6"><form id="login-form" class="panel-box" novalidate><h2>Log in</h2>
          <label class="form-label" for="login-email">Email</label><input class="form-control mb-1" id="login-email" type="text" autocomplete="email" /><div class="error-text" id="login-email-error"></div>
          <label class="form-label mt-3" for="login-password">Password</label><input class="form-control mb-1" id="login-password" type="password" autocomplete="current-password" /><div class="error-text" id="login-password-error"></div>
          <button class="btn btn-warning mt-3" type="submit">Log in</button><p id="login-status" class="mt-3 mb-0" role="status"></p>
        </form></div>
      </div></section>
    </main>
    <section class="tools-bar py-3"><div class="container d-flex justify-content-end"><button class="btn btn-outline-warning btn-sm" id="theme-btn" type="button">Switch to Day</button></div></section>
    <footer class="py-4"><div class="container">© 2026 Gold Gym Team · AITU · SE-2504</div></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/sound.js"></script><script src="js/theme.js"></script><script src="js/auth.js"></script>
  </body>
</html>
